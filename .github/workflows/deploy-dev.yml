name: Deploy dev

# Runs after a pull request is merged to main. Uses the GitHub environment
# named dev. There is no pull_request trigger.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Inject dev D1 id
        run: bash server/scripts/prepare-deploy.sh dev
      - name: Apply dev D1 migrations
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4.165.0"
          command: d1 migrations apply DB --remote --env dev
      - name: Deploy dev Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4.165.0"
          command: deploy --env dev
      - name: Record dev Worker URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOY_LOG: ${{ steps.deploy.outputs.command-output }}
        run: |
          {
            echo "### Dev Worker"
            if [ -n "$DEPLOY_URL" ]; then
              echo "$DEPLOY_URL"
            else
              printf '%s\n' "$DEPLOY_LOG" | grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' | head -1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
