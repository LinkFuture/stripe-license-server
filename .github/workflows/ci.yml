name: CI

# Pull requests only. Pushes to main are tested by deploy-dev.yml, so this
# workflow does not also run on main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tests
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
