name: Deploy production

# A published GitHub Release deploys that tag to production.
# There is no pull_request trigger: fork PRs must not receive production secrets.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Inject production D1 id
        run: bash server/scripts/prepare-deploy.sh production
      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4.165.0"
          command: d1 migrations apply DB --remote --env production
      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4.165.0"
          command: deploy --env production
      - name: Record production Worker URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOY_LOG: ${{ steps.deploy.outputs.command-output }}
        run: |
          {
            echo "### Production Worker"
            if [ -n "$DEPLOY_URL" ]; then
              echo "$DEPLOY_URL"
            else
              printf '%s\n' "$DEPLOY_LOG" | grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' | head -1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
